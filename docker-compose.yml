services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--datadir=/var/lib/mysql/data", "--innodb-use-native-aio=0"]
    networks:
      - app-net
    environment:
      MYSQL_DATABASE: student_events
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data_v3:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: student_events
      DB_USER: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: dev_only_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 1d
    networks:
      - app-net
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      server:
        condition: service_started
    networks:
      - app-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro

networks:
  app-net:
    driver: bridge
volumes:
  mysql_data_v3:
